name: ${PROJECT_NAME:?PROJECT_NAME}

services:
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:?PROJECT_NAME}-prod-redis
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "${REDIS_PORT:?REDIS_PORT}:6379"
    networks:
      - webnet

  prod-api:
    build:
      context: ..
      dockerfile: ops/docker/prod-api/Dockerfile
    image: ${PROJECT_NAME:?PROJECT_NAME}-prod-api
    container_name: ${PROJECT_NAME:?PROJECT_NAME}-prod-api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${API_PORT:?API_PORT}
      SQLITE_PATH: ${SQLITE_PATH:?SQLITE_PATH}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET}
      REDIS_URL: ${REDIS_URL:?REDIS_URL}
      LICHESS_CLIENT_ID: ${LICHESS_CLIENT_ID:?LICHESS_CLIENT_ID}
      PUSH_NOTIFICATION_API_KEY: ${PUSH_NOTIFICATION_API_KEY:?PUSH_NOTIFICATION_API_KEY}
    ports:
      - "${API_PORT:?API_PORT}:8081"
    volumes:
      - prod-api-sqlite-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  prod-api-sqlite-data:
