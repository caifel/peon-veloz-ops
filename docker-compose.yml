name: ${PROJECT_NAME:?PROJECT_NAME}

services:
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:?PROJECT_NAME}-redis
    command: redis-server --save 900 1 --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 3s
      retries: 5
    ports:
      - "${REDIS_PORT:?REDIS_PORT}:6379"
    networks:
      - webnet

  dev-ui:
    build:
      context: .
      dockerfile: docker/dev-ui/Dockerfile
    image: ${PROJECT_NAME:?PROJECT_NAME}-dev-ui
    container_name: ${PROJECT_NAME:?PROJECT_NAME}-dev-ui
    hostname: dev
    working_dir: /peonveloz/ui-astro
    command: sh -lc "npm install && npm run dev"
    tty: true
    stdin_open: true
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${UI_PORT:?UI_PORT}:4321"
    volumes:
      - ${UI_PATH:?UI_PATH}:/peonveloz/ui-astro
      # Bind mount would hide the container-built deps, so keep node_modules in
      # a named volume (also avoids macOS/Linux native binary mismatches).
      - dev-ui-astro-node-modules:/peonveloz/ui-astro/node_modules
      - dev-ui-npm-cache:/home/node/.npm
    networks:
      - webnet

  dev-api:
    build:
      context: .
      dockerfile: docker/dev-api/Dockerfile
    image: ${PROJECT_NAME:?PROJECT_NAME}-dev-api
    container_name: ${PROJECT_NAME:?PROJECT_NAME}-dev-api
    hostname: dev
    working_dir: /peonveloz/api
    command: sh -lc "bun install && bun run dev"
    tty: true
    stdin_open: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: ${API_PORT:?API_PORT}
      SQLITE_PATH: ${SQLITE_PATH:?SQLITE_PATH}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4321}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET}
      TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:?TOKEN_SIGNING_KEY}
      REDIS_URL: ${REDIS_URL:?REDIS_URL}
      LICHESS_CLIENT_ID: ${LICHESS_CLIENT_ID:?LICHESS_CLIENT_ID}
      PUSH_NOTIFICATION_API_KEY: ${PUSH_NOTIFICATION_API_KEY:?PUSH_NOTIFICATION_API_KEY}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL}
    ports:
      - "${API_PORT:?API_PORT}:4000"
    volumes:
      - ${API_PATH:?API_PATH}:/peonveloz/api
      - dev-api-node-modules:/peonveloz/api/node_modules
      - dev-api-bun-cache:/home/${BUN_USERNAME:-bun}/.bun/install/cache
      - dev-api-sqlite-data:/peonveloz/api/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - webnet

  dev-worker:
    build:
      context: .
      dockerfile: docker/dev-api/Dockerfile
    image: ${PROJECT_NAME:?PROJECT_NAME}-dev-worker
    container_name: ${PROJECT_NAME:?PROJECT_NAME}-dev-worker
    hostname: dev
    working_dir: /peonveloz/api
    command: sh -lc "bun install && bun run whatsapp:worker"
    tty: true
    stdin_open: true
    environment:
      REDIS_URL: ${REDIS_URL:?REDIS_URL}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL}
    volumes:
      - ${API_PATH:?API_PATH}:/peonveloz/api
      - dev-worker-node-modules:/peonveloz/api/node_modules
      - dev-worker-bun-cache:/home/${BUN_USERNAME:-bun}/.bun/install/cache
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  dev-ui-astro-node-modules:
  dev-ui-npm-cache:
  dev-api-node-modules:
  dev-api-bun-cache:
  dev-api-sqlite-data:
  dev-worker-node-modules:
  dev-worker-bun-cache:
